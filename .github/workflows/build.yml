# Builds Eleza Desktop for Windows (MSVC 2022, Qt from the online repository,
# OpenSSL from the vcpkg manifest) and for Linux (the distribution's Qt 6), runs
# the unit tests and uploads the packages. No secrets are used. Both jobs build
# Release: ELEZA_DEBUG_TOOLS is off, the packages have no debug / test hooks.
#
#   Windows: Eleza-<version>-windows-x64-portable (Eleza-<version>-windows-x64.zip:
#                                                  unpack and run Eleza.exe)
#            Eleza-<version>-windows-x64-setup    (the Inno Setup installer)
#   Linux:   Eleza-<version>-linux-x86_64         (Eleza-<version>-linux-x86_64.zip,
#                                                  the portable build, and a .deb)
#
# The two zip archives are at once the downloads and the packages the app
# updates itself from (packaging/make-package.py). A `v*` tag is built through
# release.yml, which calls this workflow and then signs and publishes.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 6.7 kits are published as msvc2019_64; they are what MSVC 2022 links against.
  QT_VERSION: '6.7.3'
  QT_ARCH: win64_msvc2019_64

jobs:
  windows:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # sccache keeps its entries in the GitHub Actions cache (set for the whole
      # job so every step talks to the same server).
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if (-not $match) { throw 'No VERSION in CMakeLists.txt' }
          "value=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      # Qt SVG is part of the base package in Qt 6; the add-on modules are the
      # multimedia backend, websockets and the extra image formats (WebP stickers).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtmultimedia qtwebsockets qtimageformats
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The developer prompt points VCPKG_ROOT at the copy bundled with Visual
      # Studio; the preset must use the full checkout of the runner image.
      - name: Point vcpkg at the runner's checkout
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          $cache = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      # Restored here and saved right after Configure (where vcpkg builds the
      # packages), even when a later step fails: a plain actions/cache only saves
      # at the end of a green job, so a red build rebuilt OpenSSL and rlottie
      # from source (about 10 minutes) on every run.
      - name: Restore vcpkg packages (OpenSSL, rlottie)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-

      # Compiler cache: unchanged translation units come from the GitHub Actions
      # cache instead of being compiled again. The Release flags have no /Zi, so
      # every MSVC compile is cacheable.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: cmake --preset windows-msvc-release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}

      # Keeps going after the first failure and repeats the compiler's error lines
      # as annotations, so one run shows everything that has to be fixed.
      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows-msvc-release -- -k 0 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $root = [regex]::Escape("$env:GITHUB_WORKSPACE\")
            $lines = Select-String -Path build.log -Pattern '(: (fatal )?error |: error:|^FAILED:|CMake Error|LINK : |unresolved external)' |
              ForEach-Object { ($_.Line -replace $root, '').Trim() } | Select-Object -Unique
            $chunks = @(); $current = ''
            foreach ($line in $lines) {
              if ($line.Length -gt 600) { $line = $line.Substring(0, 600) }
              if ($current.Length + $line.Length -gt 3500) { $chunks += $current; $current = '' }
              $current += $line + '%0A'
            }
            if ($current) { $chunks += $current }
            $levels = 'error', 'warning', 'notice'
            for ($i = 0; $i -lt $chunks.Count -and $i -lt 30; $i++) {
              $level = $levels[[math]::Floor($i / 10)]
              Write-Output "::$level title=Build errors $($i + 1) of $($chunks.Count)::$($chunks[$i])"
            }
            exit $code
          }

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      # GUI tests run on the offscreen platform (set per test by CMake); the
      # realtime interop test skips itself without the web client sources.
      - name: Test
        run: ctest --preset windows-msvc-release

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          $build = 'build/windows-msvc-release'
          $dist = 'dist/Eleza'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$build/Eleza/Eleza.exe" $dist
          # The updater (no Qt, static runtime): the app copies it out of the
          # install directory and starts it to swap the files of an update.
          Copy-Item "$build/Eleza/Updater.exe" $dist
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$dist/Eleza.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          # Voice calls: the media library (loaded at run time, never linked)
          # and the notices of what it contains. CMake put both next to the
          # executable after checking the archive's pinned SHA-256.
          Copy-Item "$build/Eleza/livekit_ffi.dll", "$build/Eleza/livekit_ffi-LICENSE.md" $dist
          # OpenSSL 3: our own crypto and Qt's TLS backend (tls/qopensslbackend.dll).
          $ssl = "$build/vcpkg_installed/x64-windows/bin"
          Copy-Item "$ssl/libcrypto-3-x64.dll", "$ssl/libssl-3-x64.dll" $dist
          # rlottie: Lottie (.tgs) stickers (the executable links it).
          Copy-Item "$ssl/rlottie.dll" $dist
          # The FFmpeg libraries of the multimedia backend, when windeployqt left them out.
          Get-ChildItem "$env:QT_ROOT_DIR/bin" -Filter '*.dll' |
            Where-Object { $_.Name -match '^(avcodec|avformat|avutil|swresample|swscale)-' } |
            ForEach-Object { if (-not (Test-Path "$dist/$($_.Name)")) { Copy-Item $_.FullName $dist } }
          # The C++ runtime next to the executable: the portable build needs no installer.
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          if (Test-Path $crt) { Copy-Item "$crt/*.dll" $dist }
          foreach ($required in 'Updater.exe', 'rlottie.dll', 'livekit_ffi.dll', 'livekit_ffi-LICENSE.md', 'Qt6Core.dll', 'Qt6Widgets.dll', 'Qt6Multimedia.dll', 'Qt6WebSockets.dll', 'Qt6Sql.dll', 'Qt6Svg.dll', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll', 'imageformats/qwebp.dll', 'imageformats/qsvg.dll', 'tls/qopensslbackend.dll') {
            if (-not (Test-Path "$dist/$required")) { throw "The deployed build misses $required" }
          }
          Get-ChildItem -Recurse $dist | Measure-Object -Property Length -Sum | ForEach-Object { 'Deployed {0:N1} MB' -f ($_.Sum / 1MB) }

      # Starts the deployed build once to catch a missing library. Never blocks
      # the artifacts. What is shipped is built without ELEZA_DEBUG_TOOLS (no
      # --gallery, no --debug-* flags): --version is all it is asked.
      - name: Smoke test of the deployed build
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $process = Start-Process -FilePath 'dist/Eleza/Eleza.exe' -ArgumentList '--version' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Eleza.exe did not exit' }
          if ($process.ExitCode -ne 0) { throw "Eleza.exe exited with $($process.ExitCode)" }

      # The media library of voice calls must load on a machine that has
      # nothing but Windows: only system libraries among its imports (no
      # C++ runtime DLLs, no Qt, no OpenSSL of ours).
      - name: Check the media library's imports
        shell: pwsh
        run: |
          $imports = dumpbin /dependents dist/Eleza/livekit_ffi.dll | Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          $imports
          $foreign = $imports | Where-Object { $_ -match '^(vcruntime|msvcp|qt6|libcrypto|libssl|avcodec|avformat|avutil)' }
          if ($foreign) { throw "livekit_ffi.dll needs libraries that are not part of Windows: $foreign" }

      # The updater must not need any DLL that lies next to it (it replaces
      # them): nothing but system libraries among its imports.
      - name: Check the updater's imports
        shell: pwsh
        run: |
          $imports = dumpbin /dependents dist/Eleza/Updater.exe | Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          $imports
          $foreign = $imports | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|qt6|libcrypto|libssl)' -or $_ -match '^api-ms-win-crt' }
          if ($foreign) { throw "Updater.exe must be linked statically; it imports: $foreign" }

      # Writes eleza-files.list into the folder (so the installer ships it
      # too) and packs the folder: the portable download and the update
      # package are this one archive.
      - name: Pack the portable build
        shell: pwsh
        run: |
          python packaging/make-package.py dist/Eleza "dist/Eleza-${{ steps.version.outputs.value }}-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'make-package.py failed' }

      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: Eleza-${{ steps.version.outputs.value }}-windows-x64-portable
          path: dist/Eleza-${{ steps.version.outputs.value }}-windows-x64.zip
          if-no-files-found: error

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
            if (-not (Test-Path $candidate)) { choco install innosetup --no-progress -y }
            $iscc = $candidate
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\dist\Eleza" "/DOutputDir=$PWD\dist\installer" packaging\windows\eleza.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Eleza-${{ steps.version.outputs.value }}-windows-x64-setup
          path: dist/installer/*.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64 (Ubuntu 24.04, Qt 6 from apt)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-multimedia-dev qt6-websockets-dev \
            libqt6sql6-sqlite qt6-image-formats-plugins \
            libssl-dev libgl1-mesa-dev libxkbcommon-dev \
            librlottie-dev \
            xvfb dpkg-dev

      # Compiler cache: only the files that changed since the cached run are
      # compiled again.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-release
          max-size: 1G

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DELEZA_DEBUG_TOOLS=OFF -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # The packaged binary is this one: Release, so without ELEZA_DEBUG_TOOLS
      # (no --gallery, no --debug-* flags; the tests do not need them). It must
      # answer --version, have none of the debug flags in it, and stay up on the
      # offscreen platform until the timeout ends it (exit code 124).
      - name: Smoke test (the release binary, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          grep -q '^ELEZA_DEBUG_TOOLS:BOOL=OFF$' build/CMakeCache.txt
          build/Eleza/Eleza --version
          # What the binary says is the version of the project, nothing else.
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:[^=]*=//p' build/CMakeCache.txt)"
          test "$(build/Eleza/Eleza --version)" = "Eleza Desktop $version"
          test "$(strings build/Eleza/Eleza | grep -c 'debug-login')" = 0
          code=0
          timeout 10 build/Eleza/Eleza --no-single-instance \
            --workdir="$RUNNER_TEMP/eleza-smoke" || code=$?
          test "$code" = 124

      # The portable build (the binary in a directory of its own, updates
      # itself) and the .deb (installed under /usr, updated by apt).
      - name: Package (portable zip and .deb)
        id: package
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:[^=]*=//p' build/CMakeCache.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          packaging/linux/make-portable.sh build stage-portable "dist/Eleza-$version-linux-x86_64.zip"
          ELEZA_BUILD_DIR="$PWD/build" cpack --config packaging/linux/cpack-deb.cmake -B build/cpack
          cp build/cpack/*.deb dist/
          # Voice calls: both packages carry the media library and its notices
          # where the app looks for them.
          test -f stage-portable/liblivekit_ffi.so
          test -f stage-portable/livekit_ffi-LICENSE.md
          dpkg-deb -c dist/*.deb | grep -q './usr/lib/eleza/liblivekit_ffi.so$'
          dpkg-deb -c dist/*.deb | grep -q './usr/lib/eleza/livekit_ffi-LICENSE.md$'
          ls -l dist

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Eleza-${{ steps.package.outputs.version }}-linux-x86_64
          path: dist/*
          if-no-files-found: error
